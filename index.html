<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shalimar Expert — Prastavana Prototype</title><style>
:root{--navy:#17345f;--navy2:#254f82;--gold:#e3b84f;--red:#d94841;--bg:#f4f6f9;--ink:#172b49;--muted:#748198;--line:#e5e9ef;--green:#218653}*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:var(--ink);font-family:Roboto,Arial,sans-serif}.stage{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.phone{width:100%;max-width:400px;min-height:740px;background:var(--bg);border:7px solid #172940;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 18px 55px #172b4933}.status{height:25px;background:var(--navy);color:white;padding:5px 17px;font-size:10px;display:flex;justify-content:space-between}.header{background:var(--navy);color:white;padding:12px 16px 16px}.brandline,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:16px;font-weight:900;letter-spacing:.3px}.tagline{font-size:10px;color:#d9e4f2;margin-top:3px}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff70;background:#ffffff18;display:grid;place-items:center;font-weight:bold}.redline{height:4px;background:var(--red)}main{padding:15px 14px 94px;min-height:550px}.greeting{font-size:20px;font-weight:800;margin:2px 0 4px}.muted{font-size:11px;color:var(--muted);line-height:1.45}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:12px;box-shadow:0 2px 7px #17345f08}.wallet,.hero{background:linear-gradient(125deg,var(--navy),var(--navy2));color:white;border:0}.wallet{padding:17px}.label{font-size:10px;letter-spacing:.45px;opacity:.82}.big{font-size:29px;font-weight:900;margin:7px 0}.title{font-size:14px;font-weight:800}.pill{display:inline-block;border-radius:18px;padding:5px 9px;font-size:10px;font-weight:800;background:#edf2f8;color:#315174;border:0}.goldpill{background:#fff3d6;color:#87631c}.greenpill{background:#e1f5e8;color:#187543}.btn{border:0;background:var(--navy);color:white;border-radius:9px;width:100%;padding:12px 10px;margin-top:9px;font-weight:800;font-size:12px;cursor:pointer}.goldbtn{background:var(--gold);color:#1d2d45}.light{background:#edf2f8;color:var(--navy);border:1px solid #dce4ef}.hero{margin-top:12px;border-radius:14px;padding:16px}.hero h3{font-size:18px;margin:6px 0}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.tile{padding:12px;border-radius:12px;background:white;border:1px solid var(--line);cursor:pointer}.ico{font-size:22px;margin-bottom:8px}.tile strong{font-size:12px;display:block;margin-bottom:4px}.tiny{font-size:10px;color:var(--muted);line-height:1.5}.nav{position:absolute;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 3px 12px}.nav button{border:0;background:transparent;color:#7b8799;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 0;cursor:pointer}.nav button.active{color:var(--navy);font-weight:900}.nav .ico{font-size:19px;margin:0}.progress{height:8px;background:#e9edf3;border-radius:20px;overflow:hidden;margin:9px 0}.bar{height:100%;background:var(--gold);border-radius:20px;transition:width .3s}.listitem{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f4}.listitem:last-child{border-bottom:0}.bubble{width:34px;height:34px;border-radius:10px;background:#edf2f8;display:grid;place-items:center;flex-shrink:0}.notice{padding:10px;border-radius:9px;background:#fff4db;color:#79591e;font-size:10px;line-height:1.5;margin-top:10px}.success{padding:12px;border-radius:10px;background:#e3f6e9;color:#176b3b;font-size:12px;line-height:1.5;margin-top:12px}.scanbox{background:#f5f8fc;border:1.5px dashed #b8c9dd;border-radius:14px;text-align:center;padding:23px 12px;margin-top:13px}.scanico{font-size:46px;margin-bottom:8px}.divider{height:1px;background:#edf0f4;margin:12px 0}.back{border:0;background:transparent;color:var(--navy);padding:0 0 10px;cursor:pointer;font-weight:bold;font-size:12px}.field{width:100%;border:1px solid #dce3ec;border-radius:8px;padding:11px;margin-top:6px;color:var(--ink)}.toast{display:none;position:absolute;z-index:4;top:84px;left:12px;right:12px;background:#12345d;color:white;padding:12px;border-radius:10px;font-size:12px;box-shadow:0 5px 18px #0002}.footnote{text-align:center;font-size:9px;color:var(--muted);margin-top:12px}@media(max-width:480px){.stage{padding:0}.phone{max-width:none;min-height:100vh;border:0;border-radius:0;box-shadow:none}}
</style></head><body><div class="stage"><div class="phone"><div class="status"><span>9:41</span><span>● ● ●　▰</span></div><header class="header"><div class="brandline"><div><div class="brand">SHALIMAR EXPERT</div><div class="tagline">Painter loyalty & benefits</div></div><div class="avatar">S</div></div></header><div class="redline"></div><div class="toast" id="toast"></div><main id="content"></main><nav class="nav"><button data-page="home" class="active"><span class="ico">⌂</span>Home</button><button data-page="scan"><span class="ico">▦</span>Scan</button><button data-page="points"><span class="ico">◉</span>Points</button><button data-page="prastavana"><span class="ico">♜</span>Prastavana</button><button data-page="account"><span class="ico">☻</span>Account</button></nav></div></div>
<script>
(()=>{let page='home',q=0,wallet=500,club=0,classicBonus=false,premiumBonus=false,insurance='Not activated',tx=[{name:'Joining bonus',amount:500,kind:'Wallet credit',time:'Welcome'}],timer;const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('en-IN');function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',3200)}function addTx(name,amount,kind){tx.unshift({name,amount,kind,time:'Just now'})}function qualify(){let old=club;if(q>=60000&&club<1){club=1;if(!classicBonus){classicBonus=true;wallet+=12000;addTx('Classic one-time bonus',12000,'Club bonus');toast('🎉 Classic unlocked! Demo bonus +12,000 points credited.')}}if(q>=150000&&club<2){club=2;if(!premiumBonus){premiumBonus=true;wallet+=30000;addTx('Premium one-time bonus',30000,'Club bonus');toast('🏆 Premium unlocked! Demo bonus +30,000 points credited.')}}if(old===club)toast('Scan successful! '+fmt(q)+' qualification points.')}function go(p){page=p;render()}function progressCard(title,target,sub){let p=Math.min(100,Math.round(q/target*100));return `<section class="card"><div class="row"><div class="title">${title}</div><span class="pill ${q>=target?'greenpill':'goldpill'}">${q>=target?'Achieved':'In progress'}</span></div><div class="row" style="margin-top:10px"><b style="font-size:20px">${fmt(Math.min(q,target))}</b><span class="muted">of ${fmt(target)} points</span></div><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="muted">${sub}</div></section>`}
function home(){return `<div class="greeting">Hello, Santanu 👋</div><div class="muted">Welcome back to Shalimar Expert</div><section class="card wallet"><div class="label">AVAILABLE POINTS</div><div class="big">${fmt(wallet)}</div><div class="row"><span class="label">Your reward wallet balance</span><button class="pill" onclick="go('points')">View ledger →</button></div></section><section class="hero"><div class="label">PRASTAVANA CLUB STATUS</div><h3>${club===2?'🏆 Premium Club':club===1?'⭐ Classic Club':'Your next reward is waiting'}</h3><div style="font-size:11px;opacity:.85">${club===2?'Premium tier achieved':club===1?'Classic tier achieved · Keep going!':'Scan products to unlock club benefits'}</div><button class="btn goldbtn" onclick="go('prastavana')">${club?'View club benefits':'Explore Prastavana →'}</button></section><div class="title" style="margin-top:18px">Quick actions</div><div class="tiles"><div class="tile" onclick="go('scan')"><div class="ico">▦</div><strong>Scan a coupon</strong><div class="tiny">Earn eligible points</div></div><div class="tile" onclick="go('prastavana')"><div class="ico">🏆</div><strong>Prastavana</strong><div class="tiny">Track club progress</div></div></div><section class="card"><div class="title">Recent transactions</div>${tx.slice(0,2).map(t=>`<div class="listitem"><div class="bubble">✦</div><div style="flex:1"><b style="font-size:12px">${t.name}</b><div class="tiny">${t.time}</div></div><b style="font-size:12px;color:var(--green)">+${fmt(t.amount)}</b></div>`).join('')}</section>`}
function scan(){return `<button class="back" onclick="go('home')">← Back to Home</button><div class="greeting">Scan & Earn</div><div class="muted">Scan your Shalimar product coupon to earn points.</div><div class="scanbox"><div class="scanico">▦</div><div class="title">Ready to scan your coupon?</div><div class="muted" style="margin-top:6px">Camera scanning is simulated in this prototype.</div><button class="btn" onclick="scanAdd(15000)">▦ &nbsp; Simulate successful scan (+15,000)</button><button class="btn light" onclick="scanAdd(5000)">Simulate scheme coupon (+5,000)</button></div><section class="card"><div class="row"><div><div class="muted">Prastavana qualification points</div><div style="font-size:24px;font-weight:900;margin-top:4px">${fmt(q)}</div></div><span class="pill">${club===2?'Premium':club===1?'Classic':'Not qualified'}</span></div><div class="divider"></div><div class="muted">Demo scans simulate eligible transactions. Camera, coupon validation and backend points are not connected.</div></section><div class="notice">Only eligible scan points and approved scan/coupon corrections count toward qualification. Wallet bonuses do not.</div>`}
function scanAdd(n){q+=n;wallet+=n;addTx('Eligible product scan',n,'Scan points');qualify();render()}function points(){return `<div class="greeting">Points Ledger</div><div class="muted">Available Points wallet and transaction history</div><section class="card wallet"><div class="label">AVAILABLE POINTS</div><div class="big">${fmt(wallet)}</div><div class="label">Includes scan credits and credited bonuses.</div></section><section class="card"><div class="row"><div class="title">Transaction history</div><span class="pill">${tx.length} entries</span></div>${tx.map(t=>`<div class="listitem"><div class="bubble">${t.kind==='Club bonus'?'🎁':t.kind==='Scan points'?'▦':'✦'}</div><div style="flex:1"><b style="font-size:12px">${t.name}</b><div class="tiny">${t.kind} · ${t.time}</div></div><b style="font-size:12px;color:var(--green)">+${fmt(t.amount)}</b></div>`).join('')}</section><div class="notice">Available Points and Prastavana Qualification Points are different totals.</div>`}
function prastavana(){let target=club===0?60000:150000;return `<div class="greeting">Prastavana</div><div class="muted">Your loyalty journey. Scan products to move up your club tier.</div><section class="hero"><div class="label">CURRENT CLUB</div><h3>${club===2?'🏆 Premium Club':club===1?'⭐ Classic Club':'🌟 Painter Member'}</h3><div style="font-size:11px;opacity:.85">${club===2?'You have achieved Premium!':club===1?'Classic unlocked. Keep going toward Premium.':'Your journey to Classic starts here.'}</div></section><section class="card"><div class="row"><div class="title">Your qualification progress</div><span class="pill">${fmt(q)} pts</span></div><div class="row" style="margin-top:12px"><span class="muted">Next milestone</span><b>${club===2?'Premium achieved':club===1?'Premium':'Classic'}</b></div><div class="progress"><div class="bar" style="width:${Math.min(100,Math.round(q/target*100))}%"></div></div><div class="row"><span class="muted">${fmt(q)} eligible points</span><span class="muted">${fmt(Math.max(0,target-q))} to go</span></div><button class="btn" onclick="go('scan')">▦ &nbsp; Scan products to earn</button></section>${progressCard('⭐ Classic Club',60000,'60,000 eligible points OR 5,000 litres.')}${progressCard('🏆 Premium Club',150000,'150,000 eligible points OR 9,000 litres.')}<section class="card"><div class="title">Your benefits</div><div class="listitem"><div class="bubble">🛡️</div><div><b style="font-size:12px">Accidental death insurance</b><div class="tiny">₹5 lakh benefit, subject to policy terms and activation.</div></div></div><div class="listitem"><div class="bubble">✚</div><div><b style="font-size:12px">Health consultation benefits</b><div class="tiny">${club===2?'Premium benefit details':'Classic benefit details'} as per approved program terms.</div></div></div><div class="listitem"><div class="bubble">🎁</div><div><b style="font-size:12px">Bonus points</b><div class="tiny">Credited separately to Available Points when applicable.</div></div></div><button class="btn goldbtn" onclick="go('insurance')">${insurance==='Confirmed'?'View insurance confirmation':'Activate Insurance →'}</button></section><div class="notice">Demo bonus values are illustrative and need business confirmation. Litre-based eligibility is handled through the approved V1 process.</div>`}
function insurancePage(){return `<button class="back" onclick="go('prastavana')">← Back to Prastavana</button><div class="greeting">Insurance Benefits</div><div class="muted">Club achievement and insurance activation status</div><section class="card"><div style="font-size:34px">🛡️</div><div class="title" style="margin-top:8px">Accidental Death Insurance</div><div style="font-size:28px;font-weight:900;margin:8px 0">₹5,00,000</div><div class="muted">Subject to policy eligibility, terms and insurer confirmation.</div><div class="divider"></div><div class="row"><span class="muted">Club qualification</span><span class="pill ${club?'greenpill':'goldpill'}">${club===2?'Premium':club===1?'Classic':'Not achieved'}</span></div><div class="row" style="margin-top:10px"><span class="muted">Activation status</span><span class="pill ${insurance==='Confirmed'?'greenpill':'goldpill'}">${insurance}</span></div></section>${!club?`<div class="notice">Reach an eligible club threshold before starting insurance activation.</div><button class="btn" onclick="go('prastavana')">View qualification progress</button>`:insurance==='Not activated'?`<section class="card"><div class="title">Activate your insurance</div><div class="muted" style="margin-top:6px">Continue to the insurer form. This demo simulates the handoff.</div><button class="btn" onclick="insurance='Pending';render()">Continue to insurance form →</button></section>`:insurance==='Pending'?`<section class="card"><div class="title">Insurance partner form</div><div class="muted">Demo form only. Do not enter real personal information.</div><label class="muted" style="display:block;margin-top:12px">Painter name</label><input class="field" value="Santanu (demo)" readonly><label class="muted" style="display:block;margin-top:10px">Registered mobile</label><input class="field" value="XXXXXX1234 (demo)" readonly><div class="notice">In production, complete the insurer's approved form and consent steps.</div><button class="btn" onclick="insurance='Confirmed';toast('Demo: insurance confirmation received');render()">Simulate form submission & confirmation</button><button class="btn light" onclick="insurance='Not activated';render()">Cancel</button></section>`:`<div class="success"><b>✓ Demo confirmation received</b><br>The status is now Confirmed in this prototype. No real policy has been created.</div><button class="btn light" onclick="go('prastavana')">Back to Prastavana</button>`}<div class="footnote">Prototype only · No real insurance policy is created.</div>`}
function account(){return `<div class="greeting">My Account</div><div class="muted">Painter profile and program details</div><section class="card"><div class="row"><div class="avatar" style="background:var(--navy);color:white">S</div><div style="flex:1"><b style="font-size:14px">Santanu Maity</b><div class="muted">Painter ID: DEMO-1001</div></div><span class="pill greenpill">Demo</span></div><div class="divider"></div><div class="row"><span class="muted">Club status</span><b style="font-size:12px">${club===2?'Premium':club===1?'Classic':'Not qualified'}</b></div><div class="row" style="margin-top:12px"><span class="muted">Insurance status</span><b style="font-size:12px">${insurance}</b></div><div class="row" style="margin-top:12px"><span class="muted">Qualification points</span><b style="font-size:12px">${fmt(q)}</b></div></section><section class="card"><div class="title">Demo controls</div><div class="muted" style="margin-top:5px">Reset to replay the journey.</div><button class="btn light" onclick="resetDemo()">↻ Reset demo to start</button></section>`}
function render(){let views={home,scan,points,prastavana,account,insurance:insurancePage};$('content').innerHTML=views[page]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}window.go=go;window.scanAdd=scanAdd;window.resetDemo=()=>{page='home';q=0;wallet=500;club=0;classicBonus=false;premiumBonus=false;insurance='Not activated';tx=[{name:'Joining bonus',amount:500,kind:'Wallet credit',time:'Welcome'}];toast('Demo reset. Start from Home.');render()};document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render()})();
</script></body></html>
